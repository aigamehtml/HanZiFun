name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Warm jsDelivr CDN cache
        continue-on-error: true
        run: |
          COMMIT="${GITHUB_SHA::7}"
          for pack in 000 001 002 003 004; do
            curl -sS -o /dev/null --max-time 10 \
              "https://cdn.jsdelivr.net/gh/rickytan/HanZiFun@${COMMIT}/data/strokes-pack-${pack}.zip" &
          done
          wait
          echo "Warmed jsDelivr cache for packs 000-004 at commit ${COMMIT}"
