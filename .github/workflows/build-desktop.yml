name: Build Desktop App

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 版本号
        id: version
        shell: bash
        run: |
          COMMITS=$(git rev-list HEAD --count)
          VERSION="0.2.${COMMITS}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 装系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotify-dev libnss3 libxss1 libgtk-3-0 \
            rpm fakeroot squashfs-tools appstream libappindicator3-1 \
            libglib2.0-dev libxkbfile-dev libsecret-1-dev libsecret-1-0 \
            p7zip-full zip || true

      - name: 装依赖
        run: npm install

      - name: 离线构建
        env:
          CDN_BASE: ""
        run: npm run build

      - name: 装 Electron
        run: npm install electron@30 electron-builder@25 --save-dev

      - name: 准备图标
        run: |
          mkdir -p build/icons
          cp icons/icon-512.png build/icons/icon.png
          ls -la build/icons/

      - name: 诊断
        shell: bash
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "dist/ 存在: $(test -d dist && echo YES || echo NO)"
          echo "dist/ 大小: $(du -sh dist 2>/dev/null)"
          echo "图标存在: $(test -f build/icons/icon.png && echo YES || echo NO)"
          node -e "const p=require('./package.json');console.log('build.icon:', p.build.icon);console.log('build.files:', JSON.stringify(p.build.files));console.log('main:', p.main)"

      - name: 打包
        shell: bash
        run: |
          npx electron-builder --linux deb --publish never 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "exit: $RC"
          exit $RC

      - name: 上传日志到 Gist
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ ! -f build.log ]; then echo "no build.log"; exit 0; fi
          python3 -c "
          import json, os, urllib.request
          log = open('build.log').read()
          data = json.dumps({'description': 'HanZiFun build log', 'public': True, 'files': {'build.log': {'content': log}}}).encode()
          req = urllib.request.Request('https://api.github.com/gists', data=data, method='POST')
          req.add_header('Content-Type', 'application/json')
          req.add_header('Authorization', 'token ' + os.environ.get('TOKEN', ''))
          try:
              resp = urllib.request.urlopen(req)
              gist = json.loads(resp.read())
              print('GIST_URL:', gist.get('html_url', ''))
          except Exception as e:
              print('GIST_ERROR:', str(e))
          " 2>&1

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-${{ steps.version.outputs.version }}
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14

      - name: 发布 Release
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          test -d release && test "$(ls -A release/ 2>/dev/null)" || { echo "无产物"; exit 0; }
          if gh release view "$VER" 2>/dev/null; then
            gh release upload "$VER" release/* --clobber
          else
            gh release create "$VER" \
              --title "桌面版（Linux）$VER" \
              --notes "离线构建" \
              release/*
          fi

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 版本号
        id: version
        shell: bash
        run: |
          COMMITS=$(git rev-list HEAD --count)
          VERSION="0.2.${COMMITS}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 装依赖
        run: npm install

      - name: 离线构建
        env:
          CDN_BASE: ""
        run: npm run build

      - name: 装 Electron
        run: npm install electron@30 electron-builder@25 --save-dev

      - name: 准备图标
        shell: bash
        run: |
          mkdir -p build/icons
          cp icons/icon-512.png build/icons/icon.png
          ls -la build/icons/

      - name: 诊断
        shell: bash
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "dist/ 存在: $(test -d dist && echo YES || echo NO)"
          node -e "const p=require('./package.json');console.log('build.icon:', p.build.icon);console.log('build.files:', JSON.stringify(p.build.files))"

      - name: 打包
        shell: bash
        run: |
          npx electron-builder --win --publish never 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "exit: $RC"
          exit $RC

      - name: 上传日志到 Gist
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ ! -f build.log ]; then echo "no build.log"; exit 0; fi
          python3 -c "
          import json, os, urllib.request
          log = open('build.log').read()
          data = json.dumps({'description': 'HanZiFun build log', 'public': True, 'files': {'build.log': {'content': log}}}).encode()
          req = urllib.request.Request('https://api.github.com/gists', data=data, method='POST')
          req.add_header('Content-Type', 'application/json')
          req.add_header('Authorization', 'token ' + os.environ.get('TOKEN', ''))
          try:
              resp = urllib.request.urlopen(req)
              gist = json.loads(resp.read())
              print('GIST_URL:', gist.get('html_url', ''))
          except Exception as e:
              print('GIST_ERROR:', str(e))
          " 2>&1

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows-${{ steps.version.outputs.version }}
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14

      - name: 发布 Release
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          test -d release && test "$(ls -A release/ 2>/dev/null)" || { echo "无产物"; exit 0; }
          if gh release view "$VER" 2>/dev/null; then
            gh release upload "$VER" release/* --clobber
          else
            gh release create "$VER" \
              --title "桌面版（Windows）$VER" \
              --notes "离线构建" \
              release/*
          fi
