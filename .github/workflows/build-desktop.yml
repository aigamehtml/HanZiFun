name: Build Desktop App

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 版本号
        id: version
        shell: bash
        run: |
          COMMITS=$(git rev-list HEAD --count)
          VERSION="0.2.${COMMITS}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 装系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotify-dev libnss3 libxss1 libgtk-3-0 \
            rpm fakeroot squashfs-tools appstream \
            libappindicator3-1 libglib2.0-dev \
            p7zip-full zip || true

      - name: 装依赖
        run: npm install

      - name: 离线构建
        env:
          CDN_BASE: ""
        run: npm run build

      - name: 装 Electron + Builder
        run: npm install electron@30 electron-builder@25 --save-dev

      - name: 准备图标
        run: |
          mkdir -p build/icons
          cp icons/icon-512.png build/icons/icon.png

      - name: 诊断
        shell: bash
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "dist/: $(test -d dist && ls dist/ | head -3 || echo NO)"
          echo "图标: $(test -f build/icons/icon.png && echo YES || echo NO)"
          echo "=== npm ls electron ==="
          npm ls electron 2>&1 || true
          echo "=== npm ls electron-builder ==="
          npm ls electron-builder 2>&1 || true
          echo "=== electron binary ==="
          ls node_modules/electron/dist/electron 2>&1 || echo "electron binary NOT FOUND"
          echo "=== package.json build ==="
          node -e "const p=require('./package.json');console.log(JSON.stringify(p.build,null,2))"

      - name: 打包
        shell: bash
        run: |
          ./node_modules/.bin/electron-builder --linux deb --publish never 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "exit: $RC"
          if [ $RC -eq 0 ]; then
            ls -la release/
          else
            echo "=== 错误 ==="
            tail -30 build.log
          fi
          exit $RC

      - name: 打印错误日志
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "=== 构建失败，完整日志如下 ==="
          echo "========================================"
          if [ -f build.log ]; then
            echo "build.log 大小: $(wc -c < build.log) bytes"
            echo "--- build.log 内容 ---"
            cat build.log
            echo "--- 结束 ---"
          else
            echo "build.log 不存在"
          fi
          # 把日志写到 Issue comment 方便查看
          LOG_CONTENT=$(cat build.log 2>/dev/null || echo "no log")
          SHORT_LOG=$(echo "$LOG_CONTENT" | tail -20)
          echo "日志最后 20 行:"
          echo "$SHORT_LOG"

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14

      - name: 发布 Release
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          test -d release && test "$(ls -A release/ 2>/dev/null)" || { echo "无产物"; exit 0; }
          if gh release view "$VER" 2>/dev/null; then
            gh release upload "$VER" release/* --clobber
          else
            gh release create "$VER" \
              --title "桌面版（Linux）$VER" \
              --notes "离线构建" \
              release/*
          fi

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 版本号
        id: version
        shell: bash
        run: |
          COMMITS=$(git rev-list HEAD --count)
          VERSION="0.2.${COMMITS}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 装依赖
        run: npm install

      - name: 离线构建
        env:
          CDN_BASE: ""
        run: npm run build

      - name: 装 Electron + Builder
        run: npm install electron@30 electron-builder@25 --save-dev

      - name: 准备图标
        shell: bash
        run: |
          mkdir -p build/icons
          cp icons/icon-512.png build/icons/icon.png

      - name: 打包
        shell: bash
        run: |
          ./node_modules/.bin/electron-builder --win --publish never 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "exit: $RC"
          exit $RC

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14

      - name: 发布 Release
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          test -d release && test "$(ls -A release/ 2>/dev/null)" || { echo "无产物"; exit 0; }
          if gh release view "$VER" 2>/dev/null; then
            gh release upload "$VER" release/* --clobber
          else
            gh release create "$VER" \
              --title "桌面版（Windows）$VER" \
              --notes "离线构建" \
              release/*
          fi
