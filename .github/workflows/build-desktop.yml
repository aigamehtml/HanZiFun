name: Build Desktop App

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 版本号
        id: version
        shell: bash
        run: |
          COMMITS=$(git rev-list HEAD --count)
          VERSION="0.2.${COMMITS}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 装系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotify-dev libnss3 libxss1 libgtk-3-0 \
            rpm fakeroot squashfs-tools appstream \
            libappindicator3-1 libglib2.0-dev \
            p7zip-full zip || true

      - name: 装依赖
        run: npm install

      - name: 离线构建
        env:
          CDN_BASE: ""
        run: npm run build

      - name: 装 electron-builder
        run: npm install electron-builder@25 --save-dev

      - name: 准备图标
        run: |
          mkdir -p build/icons
          cp icons/icon-512.png build/icons/icon.png

      - name: 诊断
        shell: bash
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "electron-builder: $(./node_modules/.bin/electron-builder --version 2>&1)"
          echo "dist/: $(test -d dist && ls dist/ | head -3 || echo NO)"
          echo "图标: $(test -f build/icons/icon.png && echo YES || echo NO)"
          echo "electron in node_modules: $(test -d node_modules/electron && echo YES || echo NO)"

      - name: 打包
        shell: bash
        run: |
          ./node_modules/.bin/electron-builder --linux deb --publish never 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "exit: $RC"
          if [ $RC -eq 0 ]; then
            ls -la release/
          else
            echo "=== 错误 ==="
            tail -30 build.log
          fi
          exit $RC

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-${{ steps.version.outputs.version }}
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14

      - name: 发布 Release
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          test -d release && test "$(ls -A release/ 2>/dev/null)" || { echo "无产物"; exit 0; }
          if gh release view "$VER" 2>/dev/null; then
            gh release upload "$VER" release/* --clobber
          else
            gh release create "$VER" \
              --title "桌面版（Linux）$VER" \
              --notes "离线构建" \
              release/*
          fi

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 版本号
        id: version
        shell: bash
        run: |
          COMMITS=$(git rev-list HEAD --count)
          VERSION="0.2.${COMMITS}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 装依赖
        run: npm install

      - name: 离线构建
        env:
          CDN_BASE: ""
        run: npm run build

      - name: 装 electron-builder
        run: npm install electron-builder@25 --save-dev

      - name: 准备图标
        shell: bash
        run: |
          mkdir -p build/icons
          cp icons/icon-512.png build/icons/icon.png

      - name: 打包
        shell: bash
        run: |
          ./node_modules/.bin/electron-builder --win --publish never 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "exit: $RC"
          exit $RC

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14

      - name: 发布 Release
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          test -d release && test "$(ls -A release/ 2>/dev/null)" || { echo "无产物"; exit 0; }
          if gh release view "$VER" 2>/dev/null; then
            gh release upload "$VER" release/* --clobber
          else
            gh release create "$VER" \
              --title "桌面版（Windows）$VER" \
              --notes "离线构建" \
              release/*
          fi
