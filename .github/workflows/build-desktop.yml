name: Build Desktop App

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 版本号
        id: version
        shell: bash
        run: |
          COMMITS=$(git rev-list HEAD --count)
          VERSION="0.2.${COMMITS}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: 装依赖
        run: npm install

      - name: 离线构建
        env:
          CDN_BASE: ""
        run: npm run build

      - name: 装 Electron
        run: npm install electron electron-builder

      - name: 装系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotify-dev libnss3 libxss1 libgtk-3-0 rpm fakeroot || true

      - name: 准备图标
        run: |
          mkdir -p build/icons
          cp icons/icon-512.png build/icons/icon.png

      - name: 打包
        shell: bash
        run: |
          set -ex
          node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8'));p.build.icon='build/icons/icon.png';fs=require('fs');fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          ./node_modules/.bin/electron-builder --linux --publish never
          echo "=== 产物 ==="
          ls -lh release/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          echo "=== release 产物 ==="
          ls -lh release/
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "追加到 $VER"
            gh release upload "$VER" release/* --clobber
          else
            echo "新建 $VER"
            gh release create "$VER" --title "桌面版（Linux）$VER" \
              --notes "离线构建，AppImage 双击即用，96 个笔顺包，9574 汉字" \
              release/*
          fi

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 版本号
        id: version
        shell: bash
        run: |
          COMMITS=$(git rev-list HEAD --count)
          VERSION="0.2.${COMMITS}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: 装依赖
        run: npm install

      - name: 离线构建
        env:
          CDN_BASE: ""
        run: npm run build

      - name: 装 Electron
        run: npm install electron electron-builder

      - name: 准备图标
        shell: bash
        run: |
          mkdir -p build/icons
          cp icons/icon-512.png build/icons/icon.png

      - name: 打包
        shell: bash
        run: |
          set -ex
          node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8'));p.build.icon='build/icons/icon.png';fs=require('fs');fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          ./node_modules/.bin/electron-builder --win --publish never
          echo "=== 产物 ==="
          ls -lh release/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          ls -lh release/
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "追加 Windows 产物到 $VER"
            gh release upload "$VER" release/* --clobber
          else
            echo "新建 $VER"
            gh release create "$VER" --title "桌面版（Windows）$VER" \
              --notes "离线构建，nsis 安装包 + portable 绿色版，96 个笔顺包，9574 汉字" \
              release/*
          fi
