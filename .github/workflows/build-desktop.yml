name: Build Desktop App

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 版本号
        id: version
        shell: bash
        run: |
          COMMITS=$(git rev-list HEAD --count)
          VERSION="0.2.${COMMITS}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 装系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotify-dev libnss3 libxss1 libgtk-3-0 \
            rpm fakeroot squashfs-tools appstream \
            libappindicator3-1 p7zip-full zip || true

      - name: 装依赖并构建前端
        env:
          CDN_BASE: ""
        shell: bash
        run: |
          set -e
          echo "=== npm install ==="
          npm install 2>&1 | tail -5
          echo "=== npm run build ==="
          npm run build 2>&1 | tail -10
          echo "=== dist/ check ==="
          ls -la dist/ 2>&1 | head -5
          echo "npm run build: done"

      - name: 装 electron-builder
        shell: bash
        run: |
          set -e
          npm install electron-builder@25 --save-dev 2>&1 | tail -5
          echo "electron-builder version: $(./node_modules/.bin/electron-builder --version 2>&1)"
          echo "node_modules/.bin/electron-builder: $(ls -la node_modules/.bin/electron-builder 2>&1)"

      - name: 准备图标
        run: |
          mkdir -p build/icons
          cp icons/icon-512.png build/icons/icon.png
          echo "icon: $(ls -la build/icons/icon.png 2>&1)"

      - name: 诊断
        shell: bash
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "dist/: $(test -d dist && echo YES || echo NO)"
          echo "main.cjs: $(test -f main.cjs && echo YES || echo NO)"
          echo "preload.cjs: $(test -f preload.cjs && echo YES || echo NO)"
          echo "icon: $(test -f build/icons/icon.png && echo YES || echo NO)"
          echo "=== package.json build config ==="
          node -e "const p=require('./package.json');console.log(JSON.stringify(p.build,null,2))"
          echo "=== npm ls ==="
          npm ls electron-builder 2>&1 || true
          npm ls electron 2>&1 || true

      - name: 打包
        id: pack
        shell: bash
        run: |
          set -e
          echo "=== Starting electron-builder ==="
          ./node_modules/.bin/electron-builder --linux deb --publish never 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "exit: $RC"
          if [ $RC -eq 0 ]; then
            echo "=== SUCCESS ==="
            ls -la release/ 2>&1
          else
            echo "=== FAILED ==="
            cat build.log >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $RC

      - name: 打印日志到Summary
        if: failure()
        shell: bash
        run: |
          echo "## 构建失败日志" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build.log not found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-${{ steps.version.outputs.version }}
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14

      - name: 发布 Release（非阻塞）
        if: success()
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          test -d release && test "$(ls -A release/ 2>/dev/null)" || { echo "无产物"; exit 0; }
          gh release view "$VER" 2>/dev/null && {
            echo "Release $VER 已存在，追加产物"
            gh release upload "$VER" release/* --clobber || true
          } || {
            echo "创建 Release $VER"
            gh release create "$VER" \
              --title "桌面版（Linux）$VER" \
              --notes "离线构建" \
              release/* || true
          }

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 版本号
        id: version
        shell: bash
        run: |
          COMMITS=$(git rev-list HEAD --count)
          VERSION="0.2.${COMMITS}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 装依赖并构建前端
        env:
          CDN_BASE: ""
        run: npm install && npm run build

      - name: 装 electron-builder
        run: npm install electron-builder@25 --save-dev

      - name: 准备图标
        shell: bash
        run: |
          mkdir -p build/icons
          cp icons/icon-512.png build/icons/icon.png

      - name: 打包
        shell: bash
        run: |
          ./node_modules/.bin/electron-builder --win --publish never 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "exit: $RC"
          exit $RC

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14

      - name: 发布 Release（非阻塞）
        if: success()
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          test -d release && test "$(ls -A release/ 2>/dev/null)" || { echo "无产物"; exit 0; }
          gh release view "$VER" 2>/dev/null && {
            echo "Release $VER 已存在，追加产物"
            gh release upload "$VER" release/* --clobber || true
          } || {
            echo "创建 Release $VER"
            gh release create "$VER" \
              --title "桌面版（Windows）$VER" \
              --notes "离线构建" \
              release/* || true
          }
