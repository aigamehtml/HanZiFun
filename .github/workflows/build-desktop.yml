name: Build Desktop App

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 版本号
        id: version
        shell: bash
        run: |
          COMMITS=$(git rev-list HEAD --count)
          VERSION="0.2.${COMMITS}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 装系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotify-dev libnss3 libxss1 libgtk-3-0 \
            rpm fakeroot squashfs-tools appstream libappindicator3-1 \
            p7zip-full zip || true

      - name: 装依赖
        run: npm install

      - name: 离线构建
        env:
          CDN_BASE: ""
        run: npm run build

      - name: 装 Electron
        run: npm install electron electron-builder --save-dev

      - name: 准备图标
        run: |
          mkdir -p build/icons
          cp icons/icon-512.png build/icons/icon.png

      - name: 诊断
        shell: bash
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "dist/ 存在: $(test -d dist && echo YES || echo NO)"
          echo "dist/ 大小: $(du -sh dist 2>/dev/null || echo N/A)"
          echo "图标: $(test -f build/icons/icon.png && echo YES || echo NO)"
          node -e "const p=require('./package.json');console.log('build.files:', JSON.stringify(p.build.files))"
          node -e "const p=require('./package.json');console.log('main:', p.main)"

      - name: 打包
        shell: bash
        run: |
          set -x
          # 注入图标配置
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.build.icon='build/icons/icon.png';fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('icon set');"
          # 打包，记录退出码
          npx electron-builder --linux --publish never 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "electron-builder exit code: $RC"
          ls -la release/ 2>/dev/null || echo "release/ 目录不存在"
          exit $RC

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ steps.version.outputs.version }}
          path: |
            build.log
            package.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          ls -lh release/
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" release/* --clobber
          else
            gh release create "$VER" --title "桌面版（Linux）$VER" \
              --notes "离线构建，96 笔顺包，9574 汉字" release/*
          fi

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 版本号
        id: version
        shell: bash
        run: |
          COMMITS=$(git rev-list HEAD --count)
          VERSION="0.2.${COMMITS}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 装系统库
        shell: bash
        run: |
          # Windows 不需要额外系统库
          echo "Windows runner - no extra system libs needed"

      - name: 装依赖
        run: npm install

      - name: 离线构建
        env:
          CDN_BASE: ""
        run: npm run build

      - name: 装 Electron
        run: npm install electron electron-builder --save-dev

      - name: 准备图标
        shell: bash
        run: |
          mkdir -p build/icons
          cp icons/icon-512.png build/icons/icon.png

      - name: 诊断
        shell: bash
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "dist/ 存在: $(test -d dist && echo YES || echo NO)"
          node -e "const p=require('./package.json');console.log('build.files:', JSON.stringify(p.build.files))"
          node -e "const p=require('./package.json');console.log('main:', p.main)"

      - name: 打包
        shell: bash
        run: |
          set -x
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.build.icon='build/icons/icon.png';fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('icon set');"
          npx electron-builder --win --publish never 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "exit: $RC"
          ls -la release/ 2>/dev/null || echo "release/ 不存在"
          exit $RC

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-${{ steps.version.outputs.version }}
          path: |
            build.log
            package.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" release/* --clobber
          else
            gh release create "$VER" --title "桌面版（Windows）$VER" \
              --notes "离线构建，96 笔顺包，9574 汉字" release/*
          fi
